name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'

      - name: Install protoc-gen-go (pinned to go.mod protobuf version)
        run: |
          VERSION=$(go list -m -f '{{.Version}}' google.golang.org/protobuf)
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"$VERSION"

      - name: Generate protobuf
        run: cd internal/hermes && bash proto/generate.sh

      - name: gofmt
        run: |
          OUT=$(gofmt -l ./cmd ./internal)
          if [ -n "$OUT" ]; then echo "Unformatted files:"; echo "$OUT"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Run tests (with race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/garmin-messenger-relay

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
